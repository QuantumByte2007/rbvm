<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="factors">
    <h3>External &amp; mitigation factors</h3>

    <form hx-post="/riskCalcul/submit-factors" hx-target="#result" hx-swap="innerHTML" data-edit-save-form>
        <div class="form-group">
            <label for="iExternal">I_External - applied when an asset has a QID 45004 (internet-exposed) vuln</label>
            <input class="form-control-range" id="iExternal" name="iExternal" max="2" min="1" step="0.05" th:value="${config.iExternal}" type="range">
            <span id="iExternalValue" class="value" th:text="${config.iExternal}">1.2</span><br>

            <label for="mSoc">M_SOC - applied when the asset is monitored by the SOC (CMDB)</label>
            <input class="form-control-range" id="mSoc" name="mSoc" max="2" min="0" step="0.05" th:value="${config.mSoc}" type="range">
            <span id="mSocValue" class="value" th:text="${config.mSoc}">0.8</span><br>

            <label for="mAv">M_AV - applied when the asset has an antivirus/EDR agent (CMDB)</label>
            <input class="form-control-range" id="mAv" name="mAv" max="2" min="0" step="0.05" th:value="${config.mAv}" type="range">
            <span id="mAvValue" class="value" th:text="${config.mAv}">0.9</span><br>

            <label for="mPatch">M_Patch - applied when the asset is excluded from the standard patch cycle (CMDB)</label>
            <input class="form-control-range" id="mPatch" name="mPatch" max="2" min="0" step="0.05" th:value="${config.mPatch}" type="range">
            <span id="mPatchValue" class="value" th:text="${config.mPatch}">1.3</span>
        </div>
        <button type="button" class="btn btn-default mt-3" data-edit-btn>Edit</button>
        <button type="submit" class="btn btn-primary mt-3" data-save-btn>Save</button>
    </form>

    <div id="result">
        <div th:fragment="result" th:if="${message != null}">
            <div class="alert alert-success">
                <span th:text="${message}"></span>
            </div>
        </div>
    </div>

    <script>
        [
            {inputId: 'iExternal', outputId: 'iExternalValue'},
            {inputId: 'mSoc', outputId: 'mSocValue'},
            {inputId: 'mAv', outputId: 'mAvValue'},
            {inputId: 'mPatch', outputId: 'mPatchValue'}
        ].forEach(function (item) {
            var slider = document.getElementById(item.inputId);
            var output = document.getElementById(item.outputId);
            if (slider && output) {
                slider.addEventListener('input', function () {
                    output.textContent = this.value;
                });
            }
        });
    </script>
</div>
</body>
</html>
