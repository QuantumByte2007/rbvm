<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- 1. Le HEAD : Uniquement les métadonnées et dépendances -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <title th:text="${title}">App</title>

    <!-- Bootstrap 3 CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <!-- DataTables CSS pour Bootstrap 3 (AJOUT CRUCIAL) -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap.min.css">

    <!-- Votre CSS personnalisé -->
    <link rel="stylesheet" th:href="@{/css/table-style.css}">

    <!-- jQuery (Une seule fois !) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 3 JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- DataTables JS pour Bootstrap 3 -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap.min.js"></script>

    <!-- DataTables Buttons JS pour Bootstrap 3 -->
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap.min.js"></script>

    <!-- JSZip et pdfmake (Pour l'export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script th:src="@{/js/upload.js}"></script>
</head>

<!-- 2. Le BODY : Le contenu visible de la page -->
<body>

<nav th:fragment="navbar" class="navbar navbar-inverse">
    <div class="container-fluid">
        <div class="navbar-header">
            <a class="navbar-brand" href="#">App</a>
        </div>
        <ul class="nav navbar-nav">
            <li class="active"><a href="#">Home</a></li>
            <li class="dropdown"><a class="dropdown-toggle" data-toggle="dropdown" href="#">Risk Calculator<span class="caret"></span></a>
                <ul class="dropdown-menu">
                    <li><a hx-get="/riskCalcul/weights" hx-target="#content" href="/riskCalcul/weights">Weights </a></li>
                    <li><a href="#">External factors</a></li>
                    <li><a href="#">Asset Criticality</a></li>
                </ul>
            </li>
            <li class="nav-item">
                <a class="nav-link" hx-get="/dashboard" hx-target="#content"
                   hx-push-url="true" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" hx-get="/files" hx-target="#content"
                   hx-push-url="true" href="/files">Fichiers</a>
            </li>
        </ul>
        <ul class="nav navbar-nav navbar-right">
            <li><a href="#"><span class="glyphicon glyphicon-user"></span> Sign Up</a></li>
            <li><a href="#"><span class="glyphicon glyphicon-log-in"></span> Login</a></li>
        </ul>
    </div>
</nav>

<footer th:fragment="footer" class="footer text-center mt-5 text-muted">
    <p>© 2026 Mon App</p>
</footer>

</body>
</html>
