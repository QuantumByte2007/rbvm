spring.application.name=app
server.port=${SERVER_PORT:8080}
spring.security.user.name=${SPRING_USERNAME:user}
spring.security.user.password=${SPRING_PASSWORD:user}
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${MODEL:mistral:7b}
# L'autoconfig Ollama de LangChain4j reference en dur SpringRestClient, compile contre
# Spring Boot 3 et donc inutilisable ici. Le ChatModel est construit dans Langchain4jConfig,
# qui lui passe explicitement le client HTTP JDK.
spring.autoconfigure.exclude=dev.langchain4j.ollama.spring.AutoConfig

spring.servlet.multipart.max-file-size=10MB


spring.datasource.url=${DATASOURCE_BASE_URL:jdbc:mysql://localhost:3306/test_data}
spring.datasource.username=${POSTGRES_USER:root}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=${DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.org.hibernate.SQL=DEBUG

file.base-path=${FILE_BASE_PATH:C:/Users/moham/Desktop/test8}

spring.batch.job.enabled=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.org.hibernate.orm.jdbc.batch=TRACE