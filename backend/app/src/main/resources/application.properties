spring.application.name=app
spring.security.user.name=user
spring.security.user.password=user
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=mistral:7b
# L'autoconfig Ollama de LangChain4j reference en dur SpringRestClient, compile contre
# Spring Boot 3 et donc inutilisable ici. Le ChatModel est construit dans Langchain4jConfig,
# qui lui passe explicitement le client HTTP JDK.
spring.autoconfigure.exclude=dev.langchain4j.ollama.spring.AutoConfig

spring.servlet.multipart.max-file-size=10MB


spring.datasource.url=jdbc:mysql://localhost:3306/test_data
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.org.hibernate.SQL=DEBUG

file.base-path=C:/Users/moham/Desktop/test8

spring.batch.job.enabled=false
